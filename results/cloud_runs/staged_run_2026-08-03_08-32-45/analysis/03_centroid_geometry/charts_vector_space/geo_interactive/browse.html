<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F9FC;--bg2:#fff;--bg3:#EEF2F7;--border:#D1D9E0;
  --text:#1A2332;--text2:#4B5B6D;--text3:#6B7A8D;
  --accent:#1D6FA4;--accent-bg:#EAF3FA;
  --g1:#C53030;--g1-bg:#FFF5F5;--g2:#1D4ED8;--g2-bg:#EFF6FF;
  --g3:#B45309;--g3-bg:#FFFBEB;--green:#166534;--green-bg:#F0FDF4;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0D1117;--bg2:#161B22;--bg3:#1C2128;--border:#30363D;
    --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;
    --accent:#58A6FF;--accent-bg:#0D1F36;
    --g1:#FC8181;--g1-bg:#1A0A0A;--g2:#60A5FA;--g2-bg:#0A1628;
    --g3:#FCD34D;--g3-bg:#1A1200;--green:#4ADE80;--green-bg:#051A0C;
  }
}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;}

/* ── Header ── */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;}
.header h1{font-size:16px;font-weight:700;}
.header .sub{font-size:12px;color:var(--text3);}
.stats-row{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--bg3);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;}
.stat span{color:var(--accent);font-size:14px;}

/* ── Controls ── */
.controls{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:9;}
.controls input{border:1px solid var(--border);border-radius:5px;padding:5px 10px;background:var(--bg2);color:var(--text);font-size:12px;width:280px;}
.controls input:focus{outline:none;border-color:var(--accent);}
.controls select{border:1px solid var(--border);border-radius:5px;padding:5px 8px;background:var(--bg2);color:var(--text);font-size:12px;}
.count{font-size:11px;color:var(--text3);margin-left:auto;}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg3);padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--accent);}
th .sort-arrow{opacity:.4;font-size:10px;margin-left:3px;}
th.sorted .sort-arrow{opacity:1;color:var(--accent);}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-variant-numeric:tabular-nums;}
tr:hover td{background:var(--accent-bg);cursor:pointer;}
.q-num{font-weight:700;color:var(--accent);font-size:12px;width:36px;}
.q-text{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);}
.num{text-align:right;font-family:monospace;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;font-family:monospace;}
.b-A{color:var(--g3);background:var(--g3-bg);}
.b-B{color:var(--g2);background:var(--g2-bg);}
.b-rag{color:#991B1B;background:#FEF2F2;}
.gap-bar{display:flex;align-items:center;gap:6px;}
.bar{height:8px;border-radius:3px;background:var(--accent);min-width:2px;}
.gap-num{font-family:monospace;font-size:11px;min-width:28px;text-align:right;}
.check{color:var(--green);font-size:14px;}
.cross{color:var(--g1);font-size:14px;opacity:.5;}

/* ── Empty ── */
.empty{text-align:center;padding:40px;color:var(--text3);}
</style>
</head>

const MAX_BAR = Math.max(...DATA.map(r=>r.gap));

let sortKey = 'gap';
let sortDir = -1; // -1 = desc

function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  const el = document.getElementById('h-' + key);
  if (el) {
    el.classList.add('sorted');
    el.querySelector('.sort-arrow').textContent = sortDir === -1 ? '↓' : '↑';
  }
  render();
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const mech = document.getElementById('mech-filter').value;
  const rag = document.getElementById('rag-filter').value;
  const gf = document.getElementById('gap-filter').value;
  return DATA.filter(r => {
    if (q && !r.text.toLowerCase().includes(q) && !String(r.q).includes(q)) return false;
    if (mech && r.mech !== mech) return false;
    if (rag !== '' && String(r.rag) !== rag) return false;
    if (gf === '0' && r.gap > 0) return false;
    if (gf === '10' && r.gap < 10) return false;
    if (gf === '20' && r.gap < 20) return false;
    return true;
  });
}

function render() {
  const rows = filtered().sort((a,b) => sortDir * (a[sortKey] - b[sortKey]));
  const tbody = document.getElementById('tbody');
  const pct = Math.round(DATA.filter(r=>r.gap>0).length / DATA.length * 100);
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('count-label').textContent = rows.length + ' / ' + DATA.length + ' queries';

  if (!rows.length) {
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = '';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const file = 'query_' + String(r.q).padStart(3,'0') + '.html';
    const barW = Math.max(2, Math.round(r.gap / MAX_BAR * 100));
    return `<tr onclick="open_query('${file}')" title="Click to open interactive plot">
      <td class="q-num">${r.q}</td>
      <td class="q-text" title="${r.text}">${r.text}</td>
      <td class="num">${r.g1}</td>
      <td class="num"><strong>${r.g2}</strong></td>
      <td class="num">${r.g3}</td>
      <td><div class="gap-bar"><div class="bar" style="width:${barW}px"></div><span class="gap-num">${r.gap}</span></div></td>
      <td class="num">${r.r1}</td>
      <td class="num">${r.r2}</td>
      <td><span class="badge b-${r.mech}">${r.mech}</span></td>
      <td>${r.gt_g1 ? '<span class="check">✓</span>' : '<span class="cross">✗</span>'}</td>
      <td>${r.gt_g2 ? '<span class="check">✓</span>' : '<span class="cross">✗</span>'}</td>
      <td>${r.rag ? '<span class="badge b-rag">FAIL</span>' : ''}</td>
    </tr>`;
  }).join('');
}

function open_query(file) {
  window.location.href = file;
}

// Initial sort by gap desc
document.getElementById('h-gap').classList.add('sorted');
document.getElementById('h-gap').querySelector('.sort-arrow').textContent = '↓';
render();
</script>
